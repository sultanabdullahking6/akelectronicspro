<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="logo-badge.svg">
<title>Blog — AK Electronics Pro</title>
<meta name="description" content="Arduino, ESP32, and Raspberry Pi tutorials, project ideas, and guides from AK Electronics Pro.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .blog-wrap{max-width:820px; margin:0 auto; padding:60px 20px 100px;}
  .back-link{display:inline-block; margin-bottom:24px; color:var(--muted); font-size:.85rem;}
  .back-link:hover{color:var(--cyan);}
  .blog-wrap h1{font-size:1.9rem; margin-bottom:8px;}
  .blog-wrap .sub{color:var(--muted); margin-bottom:36px;}
  .post-card{display:block; border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:16px; background:var(--panel); transition:.15s;}
  .post-card:hover{border-color:var(--cyan); transform:translateY(-2px);}
  .post-card h2{font-size:1.2rem; margin:0 0 8px; color:var(--text);}
  .post-card p{color:var(--muted); margin:0 0 10px; font-size:.9rem; line-height:1.6;}
  .post-date{font-family:var(--mono); font-size:.72rem; color:var(--cyan);}
  .empty-state{color:var(--muted); text-align:center; padding:40px 0;}
</style>
</head>
<body>
<div class="blog-wrap">
  <a href="index.html" class="back-link">← Back to AK Electronics Pro</a>
  <h1>The AK Electronics Blog</h1>
  <p class="sub">Tutorials, project ideas, and guides for Arduino, ESP32, and Raspberry Pi builders.</p>
  <div id="postsList"><p class="empty-state">Loading posts…</p></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  window.__createSupabaseClient = createClient;
  window.dispatchEvent(new Event('supabase-sdk-ready'));
</script>
<script src="config.js"></script>
<script>
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[s]));
  }
  window.addEventListener("DOMContentLoaded", async () => {
    const list = document.getElementById("postsList");
    if (!SITE_CONFIG.supabaseUrl || !SITE_CONFIG.supabaseAnonKey || !window.__createSupabaseClient){
      list.innerHTML = `<p class="empty-state">Blog isn't connected yet.</p>`;
      return;
    }
    const supabase = window.__createSupabaseClient(SITE_CONFIG.supabaseUrl, SITE_CONFIG.supabaseAnonKey);
    const { data, error } = await supabase.from("blog_posts").select("*").eq("published", true).order("created_at", { ascending: false });
    if (error || !data || !data.length){
      list.innerHTML = `<p class="empty-state">No posts yet — check back soon!</p>`;
      return;
    }
    list.innerHTML = data.map(p => `
      <a class="post-card" href="blog-post.html?slug=${encodeURIComponent(p.slug)}">
        <span class="post-date">${new Date(p.created_at).toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" })}</span>
        <h2>${escapeHtml(p.title)}</h2>
        <p>${escapeHtml(p.excerpt || "")}</p>
      </a>
    `).join("");
  });
</script>
</body>
</html>
