<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="akGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35e6ff"/>
      <stop offset="55%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#ff4d94"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35e6ff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1b1740"/>
      <stop offset="100%" stop-color="#0c0a1f"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- outer ring + background : center (300,300) radius 270 -->
  <circle cx="300" cy="300" r="270" fill="url(#bgGlow)" stroke="url(#ringGrad)" stroke-width="4"/>
  <circle cx="300" cy="300" r="253" fill="none" stroke="#7c5cff" stroke-width="1" opacity=".3"/>

  <!-- ROBOTIC ARM accent, left side -->
  <g transform="translate(108,235)" stroke="#35e6ff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <circle cx="0" cy="40" r="9" fill="#0c0a1f" stroke="#35e6ff" stroke-width="4"/>
    <path d="M0 40 L6 4"/>
    <circle cx="6" cy="4" r="6" fill="#0c0a1f" stroke="#35e6ff" stroke-width="3.4"/>
    <path d="M6 4 L34 -14"/>
    <circle cx="34" cy="-14" r="5.5" fill="#0c0a1f" stroke="#35e6ff" stroke-width="3"/>
    <path d="M34 -14 L52 -34" stroke-width="4.6"/>
    <path d="M52 -34 L64 -30" stroke-width="3.4"/>
    <path d="M52 -34 L60 -46" stroke-width="3.4"/>
  </g>

  <!-- AI ROBOT HEAD accent, right side -->
  <g transform="translate(478,225)">
    <line x1="0" y1="-30" x2="0" y2="-16" stroke="#ff4d94" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="0" cy="-32" r="4" fill="#ff4d94"/>
    <rect x="-24" y="-16" width="48" height="42" rx="14" fill="#14112b" stroke="url(#akGrad)" stroke-width="3.4"/>
    <circle cx="-10" cy="4" r="5" fill="#35e6ff"/>
    <circle cx="10" cy="4" r="5" fill="#ff4d94"/>
    <path d="M-10 18 h20 M-10 18 v6 M10 18 v6" stroke="#7c5cff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <line x1="-24" y1="0" x2="-32" y2="0" stroke="#7c5cff" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="0" x2="32" y2="0" stroke="#7c5cff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-32" cy="0" r="3" fill="#7c5cff"/>
    <circle cx="32" cy="0" r="3" fill="#7c5cff"/>
  </g>

  <!-- top chip icon with radiating pins -->
  <g transform="translate(300,140)">
    <g stroke="#35e6ff" stroke-width="2.4" opacity=".8" stroke-linecap="round">
      <line x1="0" y1="-46" x2="0" y2="-30"/>
      <line x1="-26" y1="-38" x2="-16" y2="-24"/>
      <line x1="26" y1="-38" x2="16" y2="-24"/>
      <line x1="-40" y1="-16" x2="-24" y2="-10"/>
      <line x1="40" y1="-16" x2="24" y2="-10"/>
    </g>
    <g fill="#35e6ff" opacity=".9">
      <circle cx="0" cy="-46" r="3"/>
      <circle cx="-26" cy="-38" r="3"/>
      <circle cx="26" cy="-38" r="3"/>
      <circle cx="-40" cy="-16" r="3"/>
      <circle cx="40" cy="-16" r="3"/>
    </g>
    <rect x="-22" y="-22" width="44" height="44" rx="8" fill="none" stroke="url(#akGrad)" stroke-width="3"/>
    <rect x="-11" y="-11" width="22" height="22" rx="4" fill="url(#akGrad)"/>
  </g>

  <!-- AK monogram -->
  <g filter="url(#glow)">
    <text x="300" y="300" text-anchor="middle"
      font-family="'Unbounded','Arial Black',sans-serif" font-weight="800"
      font-size="150" fill="url(#akGrad)" letter-spacing="-4">AK</text>
  </g>

  <!-- ELECTRONICS PRO ribbon -->
  <polygon points="130,340 470,340 494,376 470,412 130,412 106,376" fill="#14112b" stroke="url(#ringGrad)" stroke-width="2.5"/>
  <text x="300" y="368" text-anchor="middle" font-family="'Unbounded',sans-serif" font-weight="700" font-size="30" fill="#f4f2ff" letter-spacing="2">ELECTRONICS</text>
  <text x="300" y="399" text-anchor="middle" font-family="'Space Mono',monospace" font-weight="700" font-size="20" fill="#35e6ff" letter-spacing="6">PRO</text>

  <!-- tagline -->
  <text x="300" y="435" text-anchor="middle" font-family="'Space Mono',monospace" font-size="13" fill="#9c94c7" letter-spacing="2">BUILD · LEARN · INNOVATE</text>

  <!-- divider -->
  <line x1="160" y1="450" x2="440" y2="450" stroke="#2a2454" stroke-width="1.5"/>

  <!-- category icon row -->
  <g font-family="'Space Mono',monospace" font-size="9.5" fill="#9c94c7" text-anchor="middle">

    <g transform="translate(188,470)">
      <path d="M-13 0 a6.5 6.5 0 1 0 13 0 a6.5 6.5 0 1 0 13 0 a6.5 6.5 0 1 0 -13 0 a6.5 6.5 0 1 0 -13 0" fill="none" stroke="#35e6ff" stroke-width="2.6"/>
      <text y="22">ARDUINO</text>
    </g>

    <line x1="238" y1="455" x2="238" y2="477" stroke="#2a2454" stroke-width="1.5"/>

    <g transform="translate(268,470)">
      <rect x="-9" y="-11" width="18" height="18" rx="3" fill="none" stroke="#7c5cff" stroke-width="2.2"/>
      <rect x="-4" y="-6" width="8" height="8" fill="#7c5cff"/>
      <line x1="-9" y1="-5" x2="-13" y2="-5" stroke="#7c5cff" stroke-width="1.8"/>
      <line x1="-9" y1="3" x2="-13" y2="3" stroke="#7c5cff" stroke-width="1.8"/>
      <line x1="9" y1="-5" x2="13" y2="-5" stroke="#7c5cff" stroke-width="1.8"/>
      <line x1="9" y1="3" x2="13" y2="3" stroke="#7c5cff" stroke-width="1.8"/>
      <text y="22">ESP32</text>
    </g>

    <line x1="318" y1="455" x2="318" y2="477" stroke="#2a2454" stroke-width="1.5"/>

    <g transform="translate(348,470)">
      <circle cx="0" cy="3" r="2.2" fill="#ff4d94"/>
      <path d="M-7 3 a7 7 0 0 1 14 0" fill="none" stroke="#ff4d94" stroke-width="1.9"/>
      <path d="M-12 3 a12 12 0 0 1 24 0" fill="none" stroke="#ff4d94" stroke-width="1.9" opacity=".6"/>
      <text y="22">SENSORS</text>
    </g>

    <line x1="398" y1="455" x2="398" y2="477" stroke="#2a2454" stroke-width="1.5"/>

    <g transform="translate(428,470)">
      <circle cx="0" cy="0" r="7.5" fill="none" stroke="#35e6ff" stroke-width="2"/>
      <circle cx="0" cy="0" r="2.6" fill="#35e6ff"/>
      <g stroke="#35e6ff" stroke-width="2">
        <line x1="0" y1="-10" x2="0" y2="-7"/>
        <line x1="0" y1="10" x2="0" y2="7"/>
        <line x1="-10" y1="0" x2="-7" y2="0"/>
        <line x1="10" y1="0" x2="7" y2="0"/>
      </g>
      <text y="22">ROBOTICS</text>
    </g>
  </g>
</svg>
